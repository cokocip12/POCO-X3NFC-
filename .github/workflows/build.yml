# Build StormBreaker X13 - POCO X3 NFC (Surya)

name: Build StormBreaker X13

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. CHECKOUT STORMBREAKER X13
      # ==========================================
      - name: Checkout StormBreaker X13
        uses: actions/checkout@v4
        with:
          repository: stormbreaker-project/kernel_xiaomi_surya
          ref: X13
          path: kernel
          fetch-depth: 1

      # ==========================================
      # 2. INSTALL DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            gcc \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            python3 \
            unzip \
            zip

      # ==========================================
      # 3. SETUP TOOLCHAIN
      # ==========================================
      - name: Setup Clang toolchain
        run: |
          git clone --depth=1 \
            https://github.com/kdrag0n/proton-clang.git \
            clang

          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"

      # ==========================================
      # 4. BUILD ENVIRONMENT
      # ==========================================
      - name: Setup build environment
        run: |
          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "SUBARCH=arm64" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"

      # ==========================================
      # 5. CHECK SURYA DEFCONFIG
      # ==========================================
      - name: Check Surya defconfig
        working-directory: kernel
        run: |
          set -e

          echo "========================================"
          echo "       SURYA DEFCONFIG CHECK"
          echo "========================================"

          test -f arch/arm64/configs/surya_defconfig

          echo "Defconfig found:"
          ls -lh arch/arm64/configs/surya_defconfig

      # ==========================================
      # 6. CONFIGURE KERNEL
      # ==========================================
      - name: Configure kernel
        working-directory: kernel
        run: |
          set -e

          echo "========================================"
          echo "       CONFIGURE KERNEL"
          echo "========================================"

          BUILD_DIR="$GITHUB_WORKSPACE/out"

          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          make O="$BUILD_DIR" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            surya_defconfig

          test -f "$BUILD_DIR/.config"

          echo "Kernel configuration generated successfully."

      # ==========================================
      # 7. BUILD KERNEL
      # ==========================================
      - name: Build kernel
        working-directory: kernel
        run: |
          set -e

          echo "========================================"
          echo "          BUILD KERNEL"
          echo "========================================"

          BUILD_DIR="$GITHUB_WORKSPACE/out"

          make -j"$(nproc)" \
            O="$BUILD_DIR" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1

      # ==========================================
      # 8. VERIFY KERNEL
      # ==========================================
      - name: Verify kernel
        run: |
          set -e

          echo "========================================"
          echo "          VERIFY KERNEL"
          echo "========================================"

          KERNEL="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb"

          if [ ! -f "$KERNEL" ]; then
            echo "ERROR: Image.gz-dtb not found."

            echo ""
            echo "Available kernel images:"

            find \
              "$GITHUB_WORKSPACE/out/arch/arm64/boot" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' || true

            exit 1
          fi

          echo "Kernel found:"
          ls -lh "$KERNEL"

      # ==========================================
      # 9. CHECKOUT ANYKERNEL3
      # ==========================================
      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          path: anykernel
          fetch-depth: 1

      # ==========================================
      # 10. PREPARE ANYKERNEL3
      # ==========================================
      - name: Prepare AnyKernel3
        run: |
          set -e

          echo "========================================"
          echo "        PREPARE ANYKERNEL3"
          echo "========================================"

          cp \
            "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb" \
            "$GITHUB_WORKSPACE/anykernel/"

          cd "$GITHUB_WORKSPACE/anykernel"

          cat > anykernel.sh <<'EOF'
          # AnyKernel3 - POCO X3 NFC / Surya

          properties() {
            kernel.string=StormBreaker X13 - Surya
            do.devicecheck=0
            do.modules=0
            do.systemless=0
            do.cleanup=1
            do.cleanuponabort=0
          }

          block=/dev/block/bootdevice/by-name/boot
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto

          . tools/ak3-core.sh

          dump_boot
          write_boot
          EOF

          chmod +x anykernel.sh

          rm -f README.md

      # ==========================================
      # 11. PACKAGE FLASHABLE ZIP
      # ==========================================
      - name: Package flashable ZIP
        run: |
          set -e

          echo "========================================"
          echo "       PACKAGE FLASHABLE ZIP"
          echo "========================================"

          cd "$GITHUB_WORKSPACE/anykernel"

          ZIP_NAME="StormBreaker-X13-Surya-AOSP13.zip"

          zip -r9 \
            "$GITHUB_WORKSPACE/$ZIP_NAME" \
            . \
            -x ".git/*" \
            -x "README.md" \
            -x "*placeholder"

          echo ""
          echo "Flashable ZIP created:"
          ls -lh "$GITHUB_WORKSPACE/$ZIP_NAME"

      # ==========================================
      # 12. VERIFY FLASHABLE ZIP
      # ==========================================
      - name: Verify flashable ZIP
        run: |
          set -e

          echo "========================================"
          echo "        VERIFY FLASHABLE ZIP"
          echo "========================================"

          ZIP="$GITHUB_WORKSPACE/StormBreaker-X13-Surya-AOSP13.zip"

          test -f "$ZIP"

          unzip -t "$ZIP"

          echo ""
          echo "========================================"
          echo "       FLASHABLE ZIP READY"
          echo "========================================"

          ls -lh "$ZIP"

      # ==========================================
      # 13. UPLOAD FLASHABLE ZIP
      # ==========================================
      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: StormBreaker-X13-Surya-AOSP13
          path: StormBreaker-X13-Surya-AOSP13.zip
          if-no-files-found: error￼Enter# Build StormBreaker X13 - POCO X3 NFC (Surya)

