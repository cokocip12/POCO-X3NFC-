name: Build StormBreaker X13

on:
  workflow_dispatch:
    inputs:
      ROOT_MANAGER:
        description: "Root Manager"
        required: true
        default: "off"
        type: choice
        options:
          - off
          - ksun

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. CHECKOUT STORMBREAKER X13
      # ==========================================
      - name: Checkout StormBreaker X13
        uses: actions/checkout@v4
        with:
          repository: stormbreaker-project/kernel_xiaomi_surya
          ref: X13
          path: kernel
          fetch-depth: 1

      # ==========================================
      # 2. INSTALL DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            gcc \
            g++ \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            unzip \
            zip \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      # ==========================================
      # 3. SETUP CLANG
      # ==========================================
      - name: Setup Clang
        run: |
          git clone --depth=1 \
            https://github.com/kdrag0n/proton-clang.git \
            clang

          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"

      # ==========================================
      # 4. SETUP BUILD ENVIRONMENT
      # ==========================================
      - name: Setup build environment
        run: |
          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "SUBARCH=arm64" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"

      # ==========================================
      # 5. CHECK DEFCONFIG
      # ==========================================
      - name: Check Surya defconfig
        working-directory: kernel
        run: |
          set -e

          echo "========================================"
          echo "       SURYA DEFCONFIG CHECK"
          echo "========================================"

          test -f arch/arm64/configs/surya_defconfig

          echo "Defconfig found:"
          ls -lh arch/arm64/configs/surya_defconfig

      # ==========================================
      # INSTALL KERNELSU NEXT
      # ==========================================
      - name: Install KernelSU Next
        if: ${{ inputs.ROOT_MANAGER == 'ksun' }}
        working-directory: kernel
        run: |
          set -e

          echo "=========================================="
          echo "       INSTALLING KERNELSU NEXT"
          echo "=========================================="

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -

          echo "KernelSU Next installed successfully."

      - name: Setup build environment
        working-directory: kernel
        run: |
          export BUILD_DIR="$GITHUB_WORKSPACE/kernel/out"

          mkdir -p "$BUILD_DIR"

          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          echo "ARCH=arm64" >> "$GITHUB_ENV"

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -e

          BUILD_DIR="out"

          echo "=========================================="
          echo "          CONFIGURE KERNEL"
          echo "=========================================="

          rm -f .config

          make O="$BUILD_DIR" ARCH=arm64 surya_defconfig

          echo ""
          echo "=== CHECK CONFIG ==="
          test -f "$BUILD_DIR/.config"

          echo "Kernel configuration generated successfully."
          ls -lh "$BUILD_DIR/.config"

      # ==========================================
      - name: Configure KernelSU Next
        if: ${{ inputs.ROOT_MANAGER == 'ksun' }}
        working-directory: kernel
        run: |
          set -e

          BUILD_DIR="out"

          echo "=========================================="
          echo "       CONFIGURING KERNELSU NEXT"
          echo "=========================================="

          test -f "$BUILD_DIR/.config"

          scripts/config --file "$BUILD_DIR/.config" \
            --enable CONFIG_KSU

          if grep -q "KSU_TAMPER_SYSCALL_TABLE" drivers/kernelsu/Kconfig 2>/dev/null; then
            scripts/config --file "$BUILD_DIR/.config" \
              --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE
          fi

          make O="$BUILD_DIR" ARCH=arm64 olddefconfig

          echo ""
          echo "=========================================="
          echo "          KSUN CONFIG RESULT"
          echo "=========================================="

          grep -E '^CONFIG_KSU(=|_)' "$BUILD_DIR/.config" || true

          echo ""
          echo "CONFIG_KSU:"
          scripts/config --file "$BUILD_DIR/.config" --state CONFIG_KSU || true

          echo ""
          echo "KSUN source:"
          test -d drivers/kernelsu && echo "drivers/kernelsu: OK"

          echo ""
          echo "KernelSU Next configuration step completed."

      # ==========================================
      # BUILD KERNEL
      # ==========================================
      - name: Build Kernel
        working-directory: kernel
        run: |
          set -o pipefail

          export ARCH=arm64
          export SUBARCH=arm64

          echo "=========================================="
          echo "        BUILD KERNEL"
          echo "=========================================="

          # Pastikan output directory
          mkdir -p "$BUILD_DIR"

          # ==========================================
          # LOAD DEFCONFIG
          # ==========================================
          echo "Loading Surya defconfig..."

          DEFCONFIG=$(find arch/arm64/configs -type f \
            \( -iname '*surya*defconfig' -o -iname '*karna*defconfig' \) \
            | head -n 1)

          if [ -z "$DEFCONFIG" ]; then
            echo "❌ Surya/Karna defconfig tidak ditemukan!"
            echo ""
            echo "Defconfig yang tersedia:"
            find arch/arm64/configs -maxdepth 1 -type f -name '*defconfig' | sort | head -100
            exit 1
          fi

          DEFCONFIG=$(basename "$DEFCONFIG")

          echo "✅ Using defconfig: $DEFCONFIG"

          make O="$BUILD_DIR" "$DEFCONFIG"

          echo ""
          echo "=========================================="
          echo "CONFIG CHECK"
          echo "=========================================="

          test -f "$BUILD_DIR/.config"
          ls -lh "$BUILD_DIR/.config"

          # ==========================================
          # BUILD
          # ==========================================
          echo ""
          echo "=========================================="
          echo "STARTING KERNEL COMPILATION"
          echo "=========================================="

          set +e

          make -j"$(nproc)" O="$BUILD_DIR" 2>&1 \
            | tee "$BUILD_DIR/build.log" >/dev/null

          BUILD_STATUS=${PIPESTATUS[0]}

          set -e

          # ==========================================
          # ERROR REPORT
          # ==========================================
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo ""
            echo "=========================================="
            echo "❌ KERNEL BUILD FAILED"
            echo "=========================================="

            echo ""
            echo "===== COMPILER ERRORS ====="

            grep -Ei \
              'error:|fatal error:|undefined reference|No such file|No rule to make|recipe for target|make: \*\*\*' \
              "$BUILD_DIR/build.log" \
              | tail -100 || true

            echo ""
            echo "===== LAST 80 LINES ====="
            tail -80 "$BUILD_DIR/build.log"

            exit "$BUILD_STATUS"
          fi

          echo ""
          echo "=========================================="
          echo "✅ KERNEL BUILD SUCCESS"
          echo "=========================================="

          # ==========================================
          # VERIFY IMAGE
          # ==========================================
          if [ -f "$BUILD_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "✅ Image.gz-dtb found"
            ls -lh "$BUILD_DIR/arch/arm64/boot/Image.gz-dtb"

          elif [ -f "$BUILD_DIR/arch/arm64/boot/Image.gz" ]; then
            echo "✅ Image.gz found"
            ls -lh "$BUILD_DIR/arch/arm64/boot/Image.gz"

          elif [ -f "$BUILD_DIR/arch/arm64/boot/Image" ]; then
            echo "✅ Image found"
            ls -lh "$BUILD_DIR/arch/arm64/boot/Image"

          else
            echo "❌ Kernel image tidak ditemukan!"
            exit 1
          fi
          
      # ==========================================
      # 8. FIND KERNEL IMAGE
      # ==========================================
      - name: Verify kernel
        run: |
          set -e

          echo "========================================"
          echo "          VERIFY KERNEL"
          echo "========================================"

          BOOT_DIR="$GITHUB_WORKSPACE/out/arch/arm64/boot"

          echo "Boot directory:"
          ls -lah "$BOOT_DIR"

          KERNEL=""

          for IMAGE in \
            "$BOOT_DIR/Image.gz-dtb" \
            "$BOOT_DIR/Image.gz" \
            "$BOOT_DIR/Image"; do

            if [ -f "$IMAGE" ]; then
              KERNEL="$IMAGE"
              break
            fi

          done

          if [ -z "$KERNEL" ]; then
            echo "ERROR: Kernel image not found."
            exit 1
          fi

          echo "Kernel found:"
          ls -lh "$KERNEL"

          cp "$KERNEL" "$GITHUB_WORKSPACE/kernel.img"

      # ==========================================
      # 9. CHECKOUT ANYKERNEL3
      # ==========================================
      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          path: anykernel
          fetch-depth: 1

      # ==========================================
      # 10. PREPARE ANYKERNEL3
      # ==========================================
      - name: Prepare AnyKernel3
        run: |
          set -e

          echo "========================================"
          echo "        PREPARE ANYKERNEL3"
          echo "========================================"

          cp \
            "$GITHUB_WORKSPACE/kernel.img" \
            "$GITHUB_WORKSPACE/anykernel/"

          cd "$GITHUB_WORKSPACE/anykernel"

          cat > anykernel.sh <<'EOF'
          properties() {
            kernel.string=StormBreaker X13 - Surya
            do.devicecheck=0
            do.modules=0
            do.systemless=0
            do.cleanup=1
            do.cleanuponabort=0
          }

          block=auto
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto

          . tools/ak3-core.sh

          dump_boot
          write_boot
          EOF

          chmod +x anykernel.sh

      # ==========================================
      # 11. PACKAGE FLASHABLE ZIP
      # ==========================================
      - name: Package flashable ZIP
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/anykernel"

          ZIP_NAME="$GITHUB_WORKSPACE/StormBreaker-X13-Surya-AOSP13.zip"

          zip -r9 "$ZIP_NAME" . \
            -x ".git/*" \
            -x "README.md" \
            -x "*placeholder"

          echo "========================================"
          echo "       FLASHABLE ZIP CREATED"
          echo "========================================"

          ls -lh "$ZIP_NAME"

      # ==========================================
      # 12. VERIFY ZIP
      # ==========================================
      - name: Verify flashable ZIP
        run: |
          set -e

          ZIP="$GITHUB_WORKSPACE/StormBreaker-X13-Surya-AOSP13.zip"

          test -f "$ZIP"

          unzip -t "$ZIP"

          echo "========================================"
          echo "       FLASHABLE ZIP READY"
          echo "========================================"

          ls -lh "$ZIP"

      # ==========================================
      # 13. UPLOAD FLASHABLE ZIP
      # ==========================================
      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: StormBreaker-X13-Surya-AOSP13
          path: ${{ github.workspace }}/StormBreaker-X13-Surya-AOSP13.zip
          if-no-files-found: error
          compression-level: 0
